name: Deploy to EC2

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: # Permite ejecución manual

env:
  IMAGE_NAME: siscom-admin-api
  IMAGE_TAG: ${{ github.sha }}
  CONTAINER_NAME: siscom-admin-api

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: siscom-admin-api:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: |
          docker save siscom-admin-api:latest | gzip > siscom-admin-api.tar.gz

      - name: Copy files to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          source: "siscom-admin-api.tar.gz,docker-compose.prod.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}/siscom-admin-api"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_NAME: siscom-admin-api
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SNS_PLATFORM_APPLICATION_ARN_IOS: ${{ vars.SNS_PLATFORM_APPLICATION_ARN_IOS }}
          SNS_PLATFORM_APPLICATION_ARN_ANDROID: ${{ vars.SNS_PLATFORM_APPLICATION_ARN_ANDROID }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME }}
          # Credencial exclusiva de migraciones. Alembic la usa cuando esta
          # definida y cae a DB_USER cuando no, asi que el despliegue no se
          # rompe mientras el rol no exista todavia en la base.
          # El usuario es variable (no es secreto: es un nombre de rol) y la
          # contrasena es secret, igual que DB_USER / DB_PASSWORD.
          DB_MIGRATION_USER: ${{ vars.DB_MIGRATION_USER }}
          DB_MIGRATION_PASSWORD: ${{ secrets.DB_MIGRATION_PASSWORD }}
          COGNITO_REGION: ${{ vars.COGNITO_REGION }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_CLIENT_SECRET: ${{ secrets.COGNITO_CLIENT_SECRET }}
          DEFAULT_USER_PASSWORD: ${{ secrets.DEFAULT_USER_PASSWORD }}
          SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL }}
          SES_REGION: ${{ vars.SES_REGION }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          PASETO_SECRET_KEY: ${{ secrets.PASETO_SECRET_KEY }}
          SHARE_LOCATION_KEY_B64: ${{ secrets.SHARE_LOCATION_KEY_B64 }}
          DATA_TOKEN_PRIVATE_KEY_B64: ${{ secrets.DATA_TOKEN_PRIVATE_KEY_B64 }}
          DATA_TOKEN_KEY_ID: ${{ vars.DATA_TOKEN_KEY_ID }}
          DATA_TOKEN_INDEX_SECRET_B64: ${{ secrets.DATA_TOKEN_INDEX_SECRET_B64 }}
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          SHARE_LOCATION_USE_DATA_TOKEN: ${{ vars.SHARE_LOCATION_USE_DATA_TOKEN }}
          KORE_CLIENT_ID: ${{ secrets.KORE_CLIENT_ID }}
          KORE_CLIENT_SECRET: ${{ secrets.KORE_CLIENT_SECRET }}
          KORE_API: ${{ secrets.KORE_API }}
          KORE_API_AUTH: ${{ secrets.KORE_API_AUTH }}
          KORE_API_SMS: ${{ secrets.KORE_API_SMS }}
          KAFKA_BROKERS: ${{ vars.KAFKA_BROKERS }}
          KAFKA_RULES_UPDATES_TOPIC: ${{ vars.KAFKA_RULES_UPDATES_TOPIC }}
          KAFKA_GEOFENCES_UPDATES_TOPIC: ${{ vars.KAFKA_GEOFENCES_UPDATES_TOPIC }}
          KAFKA_USER_DEVICES_UPDATES_TOPIC: ${{ vars.KAFKA_USER_DEVICES_UPDATES_TOPIC }}
          KAFKA_UNIT_DEVICES_UPDATES_TOPIC: ${{ vars.KAFKA_UNIT_DEVICES_UPDATES_TOPIC || 'unit-devices-updates' }}
          KAFKA_USER_UNITS_UPDATES_TOPIC: ${{ vars.KAFKA_USER_UNITS_UPDATES_TOPIC || 'user-units-updates' }}
          KAFKA_MOBILITY_TOPIC: ${{ vars.KAFKA_MOBILITY_TOPIC }}
          KAFKA_TEAM_RULES_TOPIC: ${{ vars.KAFKA_TEAM_RULES_TOPIC }}
          KAFKA_RULES_UPDATES_GROUP_ID: ${{ vars.KAFKA_RULES_UPDATES_GROUP_ID }}
          KAFKA_SASL_USERNAME: ${{ vars.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          KAFKA_SASL_MECHANISM: ${{ vars.KAFKA_SASL_MECHANISM }}
          KAFKA_SECURITY_PROTOCOL: ${{ vars.KAFKA_SECURITY_PROTOCOL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          envs: IMAGE_NAME,CONTAINER_NAME,PROJECT_NAME,AWS_REGION,SNS_PLATFORM_APPLICATION_ARN_IOS,SNS_PLATFORM_APPLICATION_ARN_ANDROID,DB_HOST,DB_PORT,DB_USER,DB_PASSWORD,DB_NAME,DB_MIGRATION_USER,DB_MIGRATION_PASSWORD,COGNITO_REGION,COGNITO_USER_POOL_ID,COGNITO_CLIENT_ID,COGNITO_CLIENT_SECRET,DEFAULT_USER_PASSWORD,SES_FROM_EMAIL,SES_REGION,FRONTEND_URL,ALLOWED_ORIGINS,CONTACT_EMAIL,RECAPTCHA_SECRET_KEY,PASETO_SECRET_KEY,SHARE_LOCATION_KEY_B64,DATA_TOKEN_PRIVATE_KEY_B64,DATA_TOKEN_KEY_ID,DATA_TOKEN_INDEX_SECRET_B64,VALKEY_URL,SHARE_LOCATION_USE_DATA_TOKEN,KORE_CLIENT_ID,KORE_CLIENT_SECRET,KORE_API,KORE_API_AUTH,KORE_API_SMS,KAFKA_BROKERS,KAFKA_RULES_UPDATES_TOPIC,KAFKA_GEOFENCES_UPDATES_TOPIC,KAFKA_USER_DEVICES_UPDATES_TOPIC,KAFKA_UNIT_DEVICES_UPDATES_TOPIC,KAFKA_USER_UNITS_UPDATES_TOPIC,KAFKA_MOBILITY_TOPIC,KAFKA_TEAM_RULES_TOPIC,KAFKA_RULES_UPDATES_GROUP_ID,KAFKA_SASL_USERNAME,KAFKA_SASL_PASSWORD,KAFKA_SASL_MECHANISM,KAFKA_SECURITY_PROTOCOL
          script: |
            # Sin esto, un paso que falla no aborta el script: el despliegue
            # sigue adelante y termina imprimiendo "completado exitosamente".
            # Es lo que permitio que una migracion fallida pasara inadvertida.
            # Se usa -e y pipefail, pero NO -u: varias variables del .env son
            # legitimamente vacias y -u abortaria por ellas.
            #
            # CUIDADO con pipefail y `productor | grep -q`: grep -q sale al
            # primer match, el productor recibe SIGPIPE y termina con 141, y
            # pipefail da el pipeline por fallido AUNQUE grep haya encontrado lo
            # que buscaba. Eso rompio el despliegue de v1.27.0: el contenedor
            # habia levantado bien y el script lo dio por caido, revirtiendo la
            # imagen sin necesidad.
            # Por eso las comprobaciones usan `docker ps -q --filter` y
            # here-strings (<<<) en vez de pipes.
            set -eo pipefail

            cd /home/${{ secrets.EC2_USERNAME }}/siscom-admin-api

            # Vuelve a la imagen anterior si el contenedor nuevo no levanta.
            # Solo revierte CODIGO: el esquema ya migrado se queda como esta,
            # y por eso las migraciones deben ser compatibles hacia atras
            # (expand/contract). Si no lo fueran, hay que revertirlas a mano
            # con 'alembic downgrade', y el script lo dice.
            rollback_to_previous() {
              echo "⏪ Revirtiendo a la imagen anterior..."
              if docker image inspect siscom-admin-api:rollback >/dev/null 2>&1; then
                docker tag siscom-admin-api:rollback siscom-admin-api:latest
                docker-compose -f docker-compose.prod.yml up -d --remove-orphans || true
                echo "⏪ Codigo revertido a la imagen anterior."
                echo "⚠️  El ESQUEMA no se revierte solo. Si la migracion de este"
                echo "    despliegue no es compatible con la imagen anterior,"
                echo "    revierte a mano: alembic downgrade <revision>"
              else
                echo "⚠️  No hay imagen :rollback disponible; el servicio queda caido."
              fi
            }

            # Guardar la imagen actual para poder volver a ella si el
            # despliegue falla. Es el rollback de codigo.
            if docker image inspect siscom-admin-api:latest >/dev/null 2>&1; then
              docker tag siscom-admin-api:latest siscom-admin-api:rollback
              echo "🔖 Imagen anterior etiquetada como :rollback"
            else
              echo "ℹ️  No hay imagen previa: este despliegue no tendra rollback de codigo"
            fi

            # Cargar la nueva imagen
            echo "📦 Cargando nueva imagen Docker..."
            docker load < siscom-admin-api.tar.gz

            # Crear la red si no existe
            docker network inspect siscom-network >/dev/null 2>&1 || docker network create siscom-network

            # Crear archivo .env con las variables
            echo "🔧 Configurando variables de entorno..."
            cat > .env << EOF
            PROJECT_NAME=${PROJECT_NAME}
            AWS_REGION=${AWS_REGION}
            SNS_PLATFORM_APPLICATION_ARN_IOS=${SNS_PLATFORM_APPLICATION_ARN_IOS}
            SNS_PLATFORM_APPLICATION_ARN_ANDROID=${SNS_PLATFORM_APPLICATION_ARN_ANDROID}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            DB_NAME=${DB_NAME}
            DB_MIGRATION_USER=${DB_MIGRATION_USER}
            DB_MIGRATION_PASSWORD=${DB_MIGRATION_PASSWORD}
            COGNITO_REGION=${COGNITO_REGION}
            COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
            COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
            COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET}
            DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD}
            SES_FROM_EMAIL=${SES_FROM_EMAIL}
            SES_REGION=${SES_REGION}
            FRONTEND_URL=${FRONTEND_URL}
            ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
            CONTACT_EMAIL=${CONTACT_EMAIL}
            RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
            PASETO_SECRET_KEY=${PASETO_SECRET_KEY}
            SHARE_LOCATION_KEY_B64=${SHARE_LOCATION_KEY_B64}
            DATA_TOKEN_PRIVATE_KEY_B64=${DATA_TOKEN_PRIVATE_KEY_B64}
            DATA_TOKEN_KEY_ID=${DATA_TOKEN_KEY_ID}
            DATA_TOKEN_INDEX_SECRET_B64=${DATA_TOKEN_INDEX_SECRET_B64}
            VALKEY_URL=${VALKEY_URL}
            SHARE_LOCATION_USE_DATA_TOKEN=${SHARE_LOCATION_USE_DATA_TOKEN}
            KORE_CLIENT_ID=${KORE_CLIENT_ID}
            KORE_CLIENT_SECRET=${KORE_CLIENT_SECRET}
            KORE_API=${KORE_API}
            KORE_API_AUTH=${KORE_API_AUTH}
            KORE_API_SMS=${KORE_API_SMS}
            KAFKA_BROKERS=${KAFKA_BROKERS}
            KAFKA_RULES_UPDATES_TOPIC=${KAFKA_RULES_UPDATES_TOPIC}
            KAFKA_GEOFENCES_UPDATES_TOPIC=${KAFKA_GEOFENCES_UPDATES_TOPIC}
            KAFKA_USER_DEVICES_UPDATES_TOPIC=${KAFKA_USER_DEVICES_UPDATES_TOPIC}
            KAFKA_UNIT_DEVICES_UPDATES_TOPIC=${KAFKA_UNIT_DEVICES_UPDATES_TOPIC}
            KAFKA_USER_UNITS_UPDATES_TOPIC=${KAFKA_USER_UNITS_UPDATES_TOPIC}
            KAFKA_MOBILITY_TOPIC=${KAFKA_MOBILITY_TOPIC}
            KAFKA_TEAM_RULES_TOPIC=${KAFKA_TEAM_RULES_TOPIC}
            KAFKA_RULES_UPDATES_GROUP_ID=${KAFKA_RULES_UPDATES_GROUP_ID}
            KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME}
            KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD}
            KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM}
            KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL}
            EOF

            # Ejecutar migraciones antes de levantar el nuevo contenedor.
            #
            # Se hace ANTES de tocar el contenedor en marcha: si la migracion
            # falla, se aborta aqui y el servicio anterior sigue sirviendo
            # intacto. Ese es el rollback de esquema mas barato que hay.
            # Secrets y variables son dos secciones distintas de la misma
            # pantalla de GitHub, y poner una entrada en la equivocada NO da
            # error: interpola cadena vacia. Se anuncia con que usuario va a
            # migrar alembic para que eso sea visible en el log.
            if [ -n "${DB_MIGRATION_USER}" ]; then
              echo "🔑 Migraciones con credencial dedicada: ${DB_MIGRATION_USER}"
              if [ -z "${DB_MIGRATION_PASSWORD}" ]; then
                echo "❌ ERROR: DB_MIGRATION_USER definido pero DB_MIGRATION_PASSWORD vacio."
                echo "   Suele significar que la contrasena se guardo como variable"
                echo "   en vez de como secret. Alembic fallaria al autenticar."
                exit 1
              fi
            else
              echo "🔑 Sin DB_MIGRATION_USER: alembic migrara como ${DB_USER} (sin DDL)."
            fi

            echo "🗄️ Revision de esquema ANTES de migrar:"
            PREV_REVISION=$(docker run --rm \
              --network siscom-network \
              --env-file .env \
              siscom-admin-api:latest \
              alembic current 2>/dev/null | tail -1 || echo "desconocida")
            echo "   ${PREV_REVISION:-ninguna}"

            echo "🗄️ Ejecutando migraciones Alembic..."
            if ! docker run --rm \
              --network siscom-network \
              --env-file .env \
              siscom-admin-api:latest \
              alembic upgrade head; then
              echo "❌ ERROR: las migraciones fallaron."
              echo "   El contenedor anterior NO se ha tocado y sigue sirviendo."
              echo "   Revision previa: ${PREV_REVISION:-ninguna}"
              echo "   Para revertir un esquema ya modificado:"
              echo "     docker run --rm --network siscom-network --env-file .env \\"
              echo "       siscom-admin-api:latest alembic downgrade <revision>"
              exit 1
            fi

            echo "🗄️ Revision de esquema DESPUES de migrar:"
            docker run --rm \
              --network siscom-network \
              --env-file .env \
              siscom-admin-api:latest \
              alembic current 2>/dev/null | tail -1 || true

            # Detener y eliminar el contenedor existente de forma robusta
            echo "🛑 Deteniendo contenedores anteriores..."

            # Intentar detener con docker-compose
            docker-compose -f docker-compose.prod.yml down || true

            # Forzar detención de contenedor por nombre si existe
            # Sin pipe a proposito: ver la nota de `set -eo pipefail` arriba.
            if [ -n "$(docker ps -aq --filter "name=^${CONTAINER_NAME}$")" ]; then
              echo "Deteniendo contenedor ${CONTAINER_NAME}..."
              docker stop ${CONTAINER_NAME} || true
              docker rm ${CONTAINER_NAME} || true
            fi

            # Verificar si el puerto 8100 está en uso y liberar si es necesario
            PORT_IN_USE=$(docker ps -q --filter "publish=8100" || true)
            if [ ! -z "$PORT_IN_USE" ]; then
              echo "⚠️ Puerto 8100 en uso por contenedor(es): $PORT_IN_USE"
              echo "Deteniendo contenedor(es) que usan el puerto 8100..."
              docker stop $PORT_IN_USE || true
              docker rm $PORT_IN_USE || true
            fi

            # Limpiar contenedores huérfanos y redes no usadas
            echo "🧹 Limpiando recursos huérfanos..."
            docker-compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true

            # Levantar el nuevo contenedor
            echo "🚀 Levantando nuevo contenedor..."
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            # Esperar un momento para que el contenedor se inicie
            sleep 5

            # Verificar que el contenedor se creó correctamente
            if [ -z "$(docker ps -q --filter "name=^${CONTAINER_NAME}$")" ]; then
              echo "❌ ERROR: El contenedor ${CONTAINER_NAME} no está corriendo"
              echo "Contenedores activos:"
              docker ps -a
              echo ""
              echo "Logs del contenedor (si existe):"
              docker logs ${CONTAINER_NAME} 2>&1 || echo "No se pudo obtener logs"
              rollback_to_previous
              exit 1
            fi

            # Esperar a que el contenedor esté saludable
            echo "⏳ Esperando a que el contenedor esté saludable..."
            CONTAINER_HEALTHY=false
            for i in {1..30}; do
              # Verificar que el contenedor sigue corriendo
              if [ -z "$(docker ps -q --filter "name=^${CONTAINER_NAME}$")" ]; then
                echo "❌ ERROR: El contenedor se detuvo inesperadamente"
                echo "Logs del contenedor:"
                docker logs --tail 100 ${CONTAINER_NAME}
                rollback_to_previous
                exit 1
              fi

              STATUS=$(docker inspect --format="{{.State.Health.Status}}" ${CONTAINER_NAME} 2>/dev/null || echo "no_health_check")
              echo "Intento $i/30: Status = $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Contenedor está healthy!"
                CONTAINER_HEALTHY=true
                break
              elif [ "$STATUS" = "unhealthy" ]; then
                echo "❌ ERROR: Contenedor está unhealthy"
                echo "Logs del contenedor:"
                docker logs --tail 50 ${CONTAINER_NAME}
                rollback_to_previous
                exit 1
              elif [ "$STATUS" = "no_health_check" ]; then
                echo "⚠️ No hay health check configurado, asumiendo que está OK"
                CONTAINER_HEALTHY=true
                break
              fi

              sleep 2
            done

            if [ "$CONTAINER_HEALTHY" = false ]; then
              echo "❌ ERROR: Timeout esperando que el contenedor esté healthy"
              echo "Estado actual: $(docker inspect --format="{{.State.Status}}" ${CONTAINER_NAME})"
              echo "Logs del contenedor:"
              docker logs --tail 50 ${CONTAINER_NAME}
              rollback_to_previous
              exit 1
            fi

            # Verificar logs en busca de errores críticos
            echo "🔍 Verificando logs en busca de errores..."
            ARRANQUE_LOGS=$(docker logs ${CONTAINER_NAME} 2>&1 || true)
            if grep -q "Application startup failed" <<< "$ARRANQUE_LOGS"; then
              echo "❌ ERROR: La aplicación falló al iniciar"
              docker logs --tail 50 ${CONTAINER_NAME}
              rollback_to_previous
              exit 1
            fi

            # Limpiar imágenes antiguas
            echo "🧹 Limpiando imágenes antiguas..."
            docker image prune -f

            # Eliminar el archivo tar.gz
            rm -f siscom-admin-api.tar.gz

            echo "✅ Deployment completado exitosamente!"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            set -eo pipefail

            echo "=== Verificación Final del Deployment ==="
            echo ""

            # Verificar que el contenedor está corriendo
            echo "1. Estado del contenedor:"
            if [ -z "$(docker ps -q --filter "name=^siscom-admin-api$")" ]; then
              echo "❌ ERROR: El contenedor siscom-admin-api no está corriendo"
              exit 1
            fi
            echo "✅ Contenedor corriendo"
            echo ""

            # Verificar health status
            echo "2. Health status:"
            HEALTH_STATUS=$(docker inspect --format="{{.State.Health.Status}}" siscom-admin-api)
            echo "Status: $HEALTH_STATUS"
            if [ "$HEALTH_STATUS" != "healthy" ]; then
              echo "❌ ERROR: Contenedor no está healthy"
              exit 1
            fi
            echo "✅ Contenedor healthy"
            echo ""

            # Verificar variables críticas dentro del contenedor
            echo "3. Verificando variables AWS/SNS/CORS dentro del contenedor:"
            docker exec siscom-admin-api sh -c 'for v in AWS_REGION SNS_PLATFORM_APPLICATION_ARN_IOS SNS_PLATFORM_APPLICATION_ARN_ANDROID ALLOWED_ORIGINS; do if [ -z "$(printenv "$v")" ]; then echo "MISSING:$v"; exit 1; fi; done; echo "✅ Variables AWS/SNS/CORS presentes"'
            echo "✅ Variables AWS/SNS/CORS disponibles en runtime"
            echo ""

            # Verificar que no hay errores críticos en logs
            echo "4. Verificando logs recientes:"
            RECENT_LOGS=$(docker logs --tail 50 siscom-admin-api 2>&1)

            if grep -q "Application startup failed" <<< "$RECENT_LOGS"; then
              echo "❌ ERROR: Aplicación falló al iniciar"
              echo "$RECENT_LOGS"
              exit 1
            fi

            if grep -q "ModuleNotFoundError" <<< "$RECENT_LOGS"; then
              echo "❌ ERROR: Módulo faltante"
              echo "$RECENT_LOGS"
              exit 1
            fi

            if grep -qE "ERROR.*Exiting" <<< "$RECENT_LOGS"; then
              echo "❌ ERROR: Error crítico encontrado en logs"
              echo "$RECENT_LOGS"
              exit 1
            fi

            echo "✅ No se encontraron errores críticos"
            echo ""

            # Verificar que el health endpoint responde
            echo "5. Verificando health endpoint:"
            # /health ya consulta la base: un 200 aqui significa que la API
            # responde Y que la base es alcanzable. Por eso dejo de ser un
            # warning y pasa a abortar el despliegue.
            HEALTH_BODY=$(docker exec siscom-admin-api python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8100/health').read().decode())" 2>&1) || {
              echo "❌ ERROR: /health no responde 200"
              echo "$HEALTH_BODY"
              exit 1
            }
            echo "✅ Health endpoint responde: $HEALTH_BODY"

            # La revision de esquema deja constancia de con que version del
            # esquema quedo corriendo esta imagen. 'null' significa que alembic
            # aun no gestiona esta base (linea base sin reconciliar).
            grep -q '"database": *"ok"' <<< "$HEALTH_BODY" || {
              echo "❌ ERROR: la API responde pero la base no es alcanzable"
              exit 1
            }
            echo ""

            echo "🎉 Deployment verificado exitosamente!"
            echo ""
            echo "=== Últimos logs (informativos) ==="
            docker logs --tail 20 siscom-admin-api

      - name: Notification on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above for details."
          # Aquí puedes agregar notificaciones a Slack, Discord, email, etc.
