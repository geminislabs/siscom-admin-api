# Deriva conocida entre los modelos y el esquema de produccion
#
# La lee `scripts/verificar-deriva.py`. No es una lista de cosas aceptadas: es
# la fotografia de lo que hoy no coincide, para que deje de ser invisible.
#
# COMO SE USA
# ===========
# - Aparece una divergencia que no esta aqui  -> la CI falla. O se arregla, o
#   entra en esta lista con su porque.
# - Una de aqui deja de ocurrir               -> la CI falla igual. Hay que
#   quitarla: una linea base que no se poda deja de describir el presente.
#
# DE DONDE SALE
# =============
# Medida el 23/09/2026 al poner la FK de `users.organization_id` (#109). Hasta
# ese dia el comparador solo miraba nombres de tablas y columnas, asi que estas
# 32 divergencias nunca se habian reportado: su "sin deriva" era cierto para
# lo que comparaba y se leia como "todo coincide".
#
# Ninguna esta investigada todavia. Entran aqui tal cual se midieron, sin
# inventarles una justificacion que nadie ha comprobado.
#
# LO QUE HAY, POR SI SE VA A ATACAR
# =================================
# - Las cuatro claves foraneas sobre `organization_id` (`units`, `invitations`,
#   `orders`, `tokens_confirmacion`) son la misma forma del hueco que cerro la
#   `030` en `users`. `units.organization_id` es la otra mitad del predicado de
#   aislamiento, repetido a mano en mas de veinte endpoints.
# - Cada una necesita su propia medicion de datos contra produccion antes de
#   ponerle la restriccion: pueden tener sus propias filas apuntando al vacio, y
#   `units` tiene muchas mas filas que las 23 de `users`.
# - Casi toda la nulabilidad son `created_at` / `updated_at` que el modelo
#   declara obligatorios y la base dejo opcionales.

